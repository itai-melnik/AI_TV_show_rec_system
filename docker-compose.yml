version: '3.8'
services:
  redis-stack:
    image: redis/redis-stack:latest
    container_name: show_suggester_redis
    ports:
      - "6379:6379"   # The database port
      - "8001:8001"   # The visual dashboard port
    volumes:
      - ./redis_data:/data # Persist data so you don't lose it on restart
    restart: always